[workspace]
resolver = "2"
members = [
    "crates/antech-kdf",
    "crates/antech-kdf-core",
    "crates/antech-kdf-format",
    "crates/antech-kdf-types",
    "crates/antech-kdf-ffi",
    "crates/antech-kdf-cli",
    "crates/antech-kdf-research",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Antech KDF Research Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/antech-kdf/antech-kdf"
homepage = "https://github.com/antech-kdf/antech-kdf"
rust-version = "1.70.0"

[workspace.dependencies]
getrandom = "0.2"
base64 = "0.22"
subtle = "2.5"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
thiserror = "1.0"
clap = { version = "4.4", default-features = false, features = ["derive", "std"] }
criterion = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5"
scrypt = "0.11"
bcrypt = "0.15"
pbkdf2 = "0.12"
sha2 = "0.10"
rayon = "1.8"
csv = "1.3"
antech-kdf = { path = "crates/antech-kdf" }
antech-kdf-core = { path = "crates/antech-kdf-core" }
antech-kdf-format = { path = "crates/antech-kdf-format" }
antech-kdf-types = { path = "crates/antech-kdf-types" }
antech-kdf-research = { path = "crates/antech-kdf-research" }
