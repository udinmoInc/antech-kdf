[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antech-kdf"
version = "0.1.0"
description = "Antech KDF — thin language wrappers over the canonical Rust FFI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Udinmo, Inc.", email = "antech-kdf@udinmo.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
antech_kdf = ["py.typed"]

[project.urls]
Homepage = "https://github.com/udinmoInc/antech-kdf"
Documentation = "https://developers.udinmo.com/antech-kdf"
Repository = "https://github.com/udinmoInc/antech-kdf"
Bug Tracker = "https://github.com/udinmoInc/antech-kdf/issues"
