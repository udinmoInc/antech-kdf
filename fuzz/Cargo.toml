[package]
name = "antech-kdf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
antech-kdf-fuzz-harness = { path = "harness" }

[[bin]]
name = "hash_parser"
path = "fuzz_targets/hash_parser.rs"
test = false
doc = false

[[bin]]
name = "hash_verify"
path = "fuzz_targets/hash_verify.rs"
test = false
doc = false

[[bin]]
name = "config_builder"
path = "fuzz_targets/config_builder.rs"
test = false
doc = false

[[bin]]
name = "malformed_v2"
path = "fuzz_targets/malformed_v2.rs"
test = false
doc = false

[[bin]]
name = "ffi_api"
path = "fuzz_targets/ffi_api.rs"
test = false
doc = false

[[bin]]
name = "scheduler"
path = "fuzz_targets/scheduler.rs"
test = false
doc = false

# Isolated from the production workspace (`cargo fuzz` manages this package).
[workspace]
members = [".", "harness"]
