name: Sanitizers

# Research / security validation — separate from production CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  miri:
    name: Miri (pure-Rust production crates)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: Make Miri CI script executable
        run: chmod +x scripts/miri_ci.sh
      - name: Run full Miri campaign
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: ./scripts/miri_ci.sh
      - name: Ensure report present
        if: always()
        run: |
          mkdir -p research/results/miri
          test -f research/results/miri/summary.md
          test -f research/results/miri/tests.csv
          if [[ ! -f research/results/miri/report.md ]]; then
            OVERALL=$(grep -E 'Overall' research/results/miri/summary.md | head -1 | sed 's/.*\*\*//;s/\*\*.*//' || echo BLOCKED)
            printf '# Miri validation report\n\n**Verdict: %s**\n\nSee summary.md, tests.csv, unsafe-audit.md, logs/.\n' "$OVERALL" > research/results/miri/report.md
          fi
      - name: Upload Miri results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miri-results
          path: research/results/miri

  asan:
    name: AddressSanitizer (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Run ASan campaign
        run: |
          chmod +x scripts/sanitizers_ci.sh
          rm -f research/results/sanitizers/campaign-status.env
          ./scripts/sanitizers_ci.sh asan
      - name: Upload ASan logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-logs
          path: research/results/sanitizers

  ubsan:
    name: UndefinedBehaviorSanitizer (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Run UBSan campaign
        run: |
          chmod +x scripts/sanitizers_ci.sh
          rm -f research/results/sanitizers/campaign-status.env
          ./scripts/sanitizers_ci.sh ubsan
      - name: Upload UBSan logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubsan-logs
          path: research/results/sanitizers

  sanitizer-report:
    name: Sanitizer report + artifacts
    runs-on: ubuntu-latest
    needs: [asan, ubsan]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download ASan artifact
        uses: actions/download-artifact@v4
        with:
          name: asan-logs
          path: research/results/sanitizers-asan
      - name: Download UBSan artifact
        uses: actions/download-artifact@v4
        with:
          name: ubsan-logs
          path: research/results/sanitizers-ubsan
      - name: Merge sanitizer results
        run: |
          mkdir -p research/results/sanitizers/logs
          cp -a research/results/sanitizers-asan/* research/results/sanitizers/ 2>/dev/null || true
          cp -a research/results/sanitizers-ubsan/* research/results/sanitizers/ 2>/dev/null || true
          # Merge campaign-status.env from both runs
          touch research/results/sanitizers/campaign-status.env
          grep -h . research/results/sanitizers-asan/campaign-status.env research/results/sanitizers-ubsan/campaign-status.env >> research/results/sanitizers/campaign-status.env 2>/dev/null || true
          chmod +x scripts/sanitizers_finalize.sh
          ./scripts/sanitizers_finalize.sh
      - name: Upload combined sanitizer results
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-results
          path: research/results/sanitizers

  workspace-gates:
    name: Workspace gates (no sanitizers)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo check --workspace
        run: cargo check --workspace
      - name: cargo test --workspace
        run: cargo test --workspace
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
