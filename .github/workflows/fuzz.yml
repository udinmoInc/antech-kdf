name: Fuzz Testing

# Research / security validation — separate from production CI.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 4 * * 1" # weekly deeper campaign
  workflow_dispatch:

jobs:
  fuzz-libfuzzer:
    name: libFuzzer (cargo-fuzz)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build all fuzz targets
        run: |
          cargo fuzz build hash_parser
          cargo fuzz build hash_verify
          cargo fuzz build config_builder
          cargo fuzz build malformed_v2
          cargo fuzz build ffi_api
          cargo fuzz build scheduler
      - name: Seed corpora present
        run: find fuzz/corpus -type f | head -80
      - name: Prepare results dirs
        run: mkdir -p research/results/final-validation/fuzz research/results/fuzz
      - name: Make CI helper executable
        run: chmod +x fuzz/ci_run_and_report.sh
      - name: Fuzz all targets (timed libFuzzer)
        env:
          REPORT: research/results/final-validation/fuzz/libfuzzer.jsonl
        run: |
          PR_SECS_PARSER=120
          PR_SECS_LIGHT=60
          PR_SECS_HEAVY=90
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PR_SECS_PARSER=1800
            PR_SECS_LIGHT=900
            PR_SECS_HEAVY=1800
          fi
          : > "$REPORT"
          ./fuzz/ci_run_and_report.sh hash_parser "$PR_SECS_PARSER" "$REPORT"
          ./fuzz/ci_run_and_report.sh hash_verify "$PR_SECS_HEAVY" "$REPORT"
          ./fuzz/ci_run_and_report.sh config_builder "$PR_SECS_LIGHT" "$REPORT"
          ./fuzz/ci_run_and_report.sh malformed_v2 "$PR_SECS_LIGHT" "$REPORT"
          ./fuzz/ci_run_and_report.sh ffi_api "$PR_SECS_LIGHT" "$REPORT"
          ./fuzz/ci_run_and_report.sh scheduler "$PR_SECS_LIGHT" "$REPORT"
      - name: Summarize libFuzzer campaign
        if: always()
        run: |
          python3 <<'PY'
          import json, pathlib
          p = pathlib.Path("research/results/final-validation/fuzz/libfuzzer.jsonl")
          rows = []
          if p.exists():
              for line in p.read_text().splitlines():
                  line=line.strip()
                  if line:
                      rows.append(json.loads(line))
          fails = [r for r in rows if r.get("status") != "PASS"]
          summary = {
              "engine": "libFuzzer",
              "status": "FAIL" if fails else ("PASS" if rows else "NOT_RUN"),
              "targets": rows,
              "total_executions_approx": sum(int(r.get("executions_approx") or 0) for r in rows),
              "total_artifact_files": sum(int(r.get("artifact_files") or 0) for r in rows),
          }
          out = pathlib.Path("research/results/final-validation/fuzz/summary.json")
          out.write_text(json.dumps(summary, indent=2))
          md = ["# libFuzzer campaign\n", f"**Status:** {summary['status']}\n", "| Target | Status | Execs | Corpus | Artifacts | Secs |\n|---|---|---:|---:|---:|---:|"]
          for r in rows:
              md.append(f"| {r['target']} | {r['status']} | {r.get('executions_approx',0)} | {r.get('corpus_after',0)} | {r.get('artifact_files',0)} | {r.get('elapsed_secs',0)} |")
          pathlib.Path("research/results/final-validation/fuzz/summary.md").write_text("\n".join(md)+"\n")
          print(json.dumps(summary, indent=2))
          if fails:
              raise SystemExit(1)
          PY
      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-libfuzzer-results
          path: |
            research/results/final-validation/fuzz
            fuzz/artifacts
            fuzz/corpus

  fuzz-fallback:
    name: Fallback harness (non-libFuzzer)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run fallback harness (2 min/target)
        env:
          ANTECH_FUZZ_SECS: "120"
        run: cargo run --manifest-path fuzz/Cargo.toml -p antech-kdf-fuzz-harness --release
      - name: Copy fallback summary into final-validation
        if: always()
        run: |
          mkdir -p research/results/final-validation/fuzz
          if [ -f research/results/fuzz/summary.json ]; then
            cp research/results/fuzz/summary.json research/results/final-validation/fuzz/fallback-summary.json
          fi
      - name: Upload fallback results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-fallback-results
          path: |
            research/results/fuzz
            research/results/final-validation/fuzz
